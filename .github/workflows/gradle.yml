# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    
permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Create application.yml
      run: |
        mkdir -p src/main/resources
        echo "${{secrets.SPRING_YML}}" > src/main/resources/application.yml

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Make gradlew executable
      run: chmod +x ./gradlew


    - name: Build Gradle
      uses: gradle/gradle-build-action@v3
      with:  #액션에 인자를 전달.
        arguments: clean bootJar 
        cache-read-only: false
    - name: docker image build
      run: docker build -t ${{secrets.DOCKER_USERNAME}}/testone:latest .

    - name: docker login
      uses: docker/login-action@v2
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}

    - name: docker Hub push
      run: docker push ${{secrets.DOCKER_USERNAME}}/testone

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set target IP
        run: |
          STATUS=$(curl -o /dev/null -w "%{http_code}" "https://${{secrets.LIVE_SERVER_IP}}/env")
          echo $STATUS
          if [ "$STATUS" = "200" ]; then
            CURRENT_UPSTREAM=$(curl -s "https://${{secrets.LIVE_SERVER_IP}}/env")
          else
            CURRENT_UPSTREAM=green
          fi
          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV
          if [ "$CURRENT_UPSTREAM" = "blue" ]; then
            echo "CURRENT_PORT=8081" >> $GITHUB_ENV
            echo "STOPPED_PORT=8082" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
          elif [ "$CURRENT_UPSTREAM" = "green" ]; then
            echo "CURRENT_PORT=8082" >> $GITHUB_ENV
            echo "STOPPED_PORT=8081" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
          else
            echo "error"
            exit 1
          fi

      #- name: docker pull
        #run: sudo docker pull ${{secrets.DOCKER_USERNAME}}/testone:latest

      - name: docker compose
        run: sudo docker-compose -f docker-compose-${{env.TARGET_UPSTREAM}}.yml up -d --build

      - name: Change nginx upstram
        run: |
          echo "set \$service_url ${{env.TARGET_UPSTREAM}};" | sudo tee /etc/nginx/conf.d/service-env.inc
          sudo nginx -s reload

      - name: Stop docker container
        run: |
          sudo docker stop ${{env.CURRENT_UPSTREAM}}
          sudo docker rm ${{env.CURRENT_UPSTREAM}}
          

